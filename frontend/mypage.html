<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的主页 - Muryo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/mypage.css">

    <!-- 预连接，优化 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page">

    <!-- 顶部栏 -->
    <header class="topbar">
        <div class="logo">Muryo ~</div>
        <div class="user-actions">
            <span id="welcomeText"></span>
            <button id="loginBtn" type="button">登录</button>
            <button id="logoutBtn" type="button">退出登录</button>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="main">

        <!-- 侧边栏 -->
        <aside class="sidebar">
            <nav>
                <ul>
                    <li id="homeNav" role="button" tabindex="0">首页</li>
                    <li id="myPageNav" class="active" role="button" tabindex="0">我的主页</li>
                    <li id="myApplyNav" role="button" tabindex="0">我的申请</li>
                    <li id="myExchangeNav" role="button" tabindex="0">我的交换</li>
                    <li id="todoApplyNav" role="button" tabindex="0">待办申请</li>
                    <li id="adminEntry" role="button" tabindex="0" style="display: none;">管理员中心</li>
                </ul>
            </nav>
        </aside>

        <!-- 内容区域 -->
        <section class="content">
            <div class="content-header">
                <div>
                    <h1>我的主页</h1>
                    <p>查看个人信息和我发布的制品</p>
                </div>
                <button id="openPublishModalBtn" class="publish-btn" type="button">发布制品</button>
            </div>

            <div class="profile-card" id="profileCard">
                <h2>个人信息</h2>
                <p class="loading-text">加载中...</p>
            </div>

            <div class="my-items-section">
                <div class="section-title-row">
                    <h2>我的制品</h2>
                    <span id="myItemCountText">正在统计...</span>
                </div>
                <div class="item-list" id="myItemList">
                    <p class="loading-text">正在加载我的制品...</p>
                </div>
            </div>

            <div class="my-items-section" style="margin-top: 42px;">
                <div class="section-title-row">
                    <h2>我的收藏</h2>
                    <span id="myCollectionCountText">正在统计...</span>
                </div>
                <div class="item-list" id="myCollectionList">
                    <p class="loading-text">正在加载我的收藏...</p>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- 发布制品弹窗 -->
<div class="modal-mask" id="publishModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>发布制品</h2>
            <button id="closePublishModalBtn" class="close-btn" type="button" aria-label="关闭弹窗">×</button>
        </div>
        <form id="publishForm">
            <label>制品名称</label>
            <input type="text" id="itemName" required>
            
            <label>角色</label>
            <input type="text" id="role" placeholder="例如：阿米娅、初音未来、汤汤">
            
            <label>类型</label>
            <input type="text" id="type" placeholder="例如：吧唧、色纸、立牌">
            
            <label>数量</label>
            <input type="number" id="quantity" min="1" required>
            
            <label>制品图片链接 (URL/相对路径)</label>
            <input type="text" id="itemImage" placeholder="例如：upload/my_item.png 或 http://...">
            
            <label>介绍</label>
            <textarea id="intro" rows="4" placeholder="简单介绍一下这个制品吧~"></textarea>
            
            <button type="submit" class="submit-btn" id="publishBtn">确认发布</button>
        </form>
    </div>
</div>

<!-- 编辑个人资料弹窗 -->
<div class="modal-mask" id="editProfileModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>编辑个人资料</h2>
            <button id="closeEditProfileBtn" class="close-btn" type="button" aria-label="关闭弹窗">×</button>
        </div>
        <form id="editProfileForm">
            <label>用户名</label>
            <input type="text" id="editUserName" required>
            
            <label>联系方式</label>
            <input type="text" id="editContact" placeholder="填写邮箱或手机号">
            
            <label>个人简介</label>
            <textarea id="editIntro" rows="3" placeholder="介绍一下自己吧~"></textarea>
            
            <label>修改密码 (留空则不修改)</label>
            <input type="password" id="editPassword" placeholder="******">
            
            <button type="submit" class="submit-btn">保存修改</button>
        </form>
    </div>
</div>

<!-- 申请交换弹窗 -->
<div class="modal-mask" id="applyModal">
    <div class="modal-box" style="width: 400px;">
        <div class="modal-header">
            <h2>申请交换</h2>
            <button id="closeApplyModalBtn" class="close-btn" type="button" aria-label="关闭弹窗">×</button>
        </div>
        <div style="margin-bottom: 20px; color: #74542e; font-size: 15px; line-height: 1.5;">
            你正在向 <strong><span id="applyOwnerName"></span></strong> 申请交换：<br>
            <strong style="color: #b48752; font-size: 18px;" id="applyItemName"></strong>
        </div>
        <form id="applyForm">
            <label>申请数量 (当前余量: <span id="applyMaxQty">0</span>)</label>
            <input type="number" id="applyQuantity" min="1" required>
            <button type="submit" class="submit-btn" id="submitApplyBtn" style="margin-top: 24px;">发送申请</button>
        </form>
    </div>
</div>

<script src="js/auth.js" defer></script>
<script src="js/mypage.js" defer></script>
</body>
</html>
