<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页 - Muryo</title>
    <link rel="stylesheet" href="css/mypage.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page">

    <header class="topbar">
        <div class="logo">Muryo ~</div>

        <div class="user-actions">
            <span id="welcomeText"></span>
            <button id="loginBtn" onclick="goLogin()">登录</button>
            <button id="logoutBtn" onclick="logout()">退出登录</button>
        </div>
    </header>

    <div class="main">

        <aside class="sidebar">
            <ul>
                <li onclick="goHome()">首页</li>
                <li class="active" onclick="goMyPage()">我的主页</li>
                <li onclick="goMyApply()">我的申请</li>
                <li onclick="goMyExchange()">我的交换</li>
                <li onclick="goTodoApply()">待办申请</li>
            </ul>
        </aside>

        <section class="content">
            <div class="content-header">
                <div>
                    <h1>我的主页</h1>
                    <p>查看个人信息和我发布的制品</p>
                </div>

                <button class="publish-btn" onclick="openPublishModal()">发布制品</button>
            </div>

            <div class="profile-card" id="profileCard">
                <h2>个人信息</h2>
                <p class="loading-text">加载中...</p>
            </div>

            <div class="my-items-section">
                <h2>我的制品</h2>
                <div class="section-title-row">
                    <h2>我的制品</h2>
                    <span id="myItemCountText">正在统计...</span>
                </div>

                <div class="item-list" id="myItemList">
                    <p class="loading-text">正在加载我的制品...</p>
                </div>
            </div>
        </section>

    </div>
</div>

<!-- 发布制品弹窗 -->
<div class="modal-mask" id="publishModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>发布制品</h2>
            <span class="close-btn" onclick="closePublishModal()">×</span>
        </div>

        <form id="publishForm" onsubmit="publishItem(); return false;">
            <label>制品名称</label>
            <input type="text" id="itemName" required>

            <label>角色</label>
            <input type="text" id="role" placeholder="例如：阿米娅、初音未来、汤汤">

            <label>类型</label>
            <input type="text" id="type" placeholder="例如：吧唧、色纸、立牌">

            <label>数量</label>
            <input type="number" id="quantity" min="1" required>

            <label>制品图片地址</label>
            <input type="text" id="img_url" placeholder="可以先不填，默认使用占位图">

            <label>介绍</label>
            <textarea id="intro" rows="4" placeholder="简单介绍一下这个制品吧~"></textarea>

             <button type="submit" class="submit-btn" id="publishBtn">确认发布</button>
        </form>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/mypage.js"></script>
</body>
</html>
