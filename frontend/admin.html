<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muryo-管理员中心</title>

    <link rel="stylesheet" href="css/admin.css">

    <!--预连接，优化性能-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="page">
    <header class="topbar">
        <div class="logo">Muryo ~</div>

        <div class="user-actions">
            <span id="welcomeText"></span>
            <button id="loginBtn">登录</button>
            <button id="logoutBtn">退出登录</button>
        </div>
    </header>

    <main class="main">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li id="homeNav" role="button" tabindex="0">首页</li>
                    <li id="myPageNav" role="button" tabindex="0">我的主页</li>
                    <li id="myApplyNav" role="button" tabindex="0">我的申请</li>
                    <li id="myExchangeNav" role="button" tabindex="0">我的交换</li>
                    <li id="todoApplyNav" role="button" tabindex="0">待办申请</li>
                    <li id="adminEntry" class="active" role="button" tabindex="0">管理员中心</li>
                </ul>
            </nav>
        </aside>

        <section class="content">
            <div class="content-header">
                <h1>管理员中心</h1>
                <p id="adminInfo">正在加载管理员身份...</p>
            </div>

            <div id="adminContent" class="admin-content">
                <p>正在加载权限功能...</p>
            </div>
        </section>
    </main>
</div>

<script src="js/auth.js" defer></script>
<script src="js/admin.js" defer></script>
</body>
</html>
