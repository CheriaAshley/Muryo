<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员中心 - Muryo</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="page">
    <header class="topbar">
        <div class="logo">Muryo ~</div>

        <div class="user-actions">
            <span id="welcomeText"></span>
            <button id="loginBtn" onclick="goLogin()">登录</button>
            <button id="logoutBtn" onclick="logout()">退出登录</button>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar">
            <ul>
                <li onclick="goHome()">首页</li>
                <li onclick="goMyPage()">我的主页</li>
                <li onclick="goMyApply()">我的申请</li>
                <li onclick="goMyExchange()">我的交换</li>
                <li onclick="goTodoApply()">待办申请</li>
                <li id="adminEntry" onclick="goAdminCenter()" style="display: none;">管理员中心</li>
            </ul>
        </aside>

        <section class="content">
            <div class="content-header">
                <h1>管理员中心</h1>
                <p id="adminInfo">正在加载管理员身份...</p>
            </div>

            <div id="adminContent" class="admin-content">
                <p>正在加载权限功能...</p>
            </div>
        </section>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
