<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muryo 首页</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page">

    <header class="topbar">
        <div class="logo">Muryo ~</div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索制品或厨子" onkeydown="handleSearchEnter(event)">
            <button onclick="searchItems()">搜索</button>
            <button onclick="resetSearch()">查看全部</button>
        </div>

        <div class="user-actions">
            <span id="welcomeText"></span>
            <button id="loginBtn" onclick="goLogin()">登录</button>
            <button id="logoutBtn" onclick="logout()">退出登录</button>
        </div>
    </header>

    <div class="main">

        <aside class="sidebar">
            <ul>
                <li class="active" onclick="goHome()">首页</li>
                <li onclick="goMyPage()">我的主页</li>
                <li onclick="goMyApply()">我的申请</li>
                <li onclick="goMyExchange()">我的交换</li>
                <li onclick="goTodoApply()">待办申请</li>
                <li id="adminEntry" onclick="goAdminCenter()" style="display: none;">管理员中心</li>
            </ul>
        </aside>

        <section class="content">
            <div class="content-header">
                <h1>制品广场</h1>
                <p>这里显示所有符合要求的制品，快去交换吧！</p>
                <p id="itemCountText" class="item-count-text">正在统计制品数量...</p>
            </div>

            <div class="item-list" id="itemList">
                <p class="loading-text">正在加载制品...</p>
            </div>
        </section>

    </div>
</div>


<script src="js/auth.js"></script>
<script src="js/index.js"></script>
</body>
</html>
