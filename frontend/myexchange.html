<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的交换 - Muryo</title>
    <link rel="stylesheet" href="css/myexchange.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page">
    
    <header class="topbar">
        <div class="logo">Muryo ~</div>

        <div class="user-actions">
            <span id="welcomeText"></span>
            <button id="loginBtn" onclick="goLogin()">登录</button>
            <button id="logoutBtn" onclick="logout()">退出登录</button>
        </div>
    </header>

    <div class="main">
        
        <aside class="sidebar">
            <ul>
                <li onclick="goHome()">首页</li>
                <li onclick="goMyPage()">我的主页</li>
                <li onclick="goMyApply()">我的申请</li>
                <li class="active" onclick="goMyExchange()">我的交换</li>
                <li onclick="goTodoApply()">待办申请</li>
                <li id="adminEntry" onclick="goAdminCenter()" style="display: none;">管理员中心</li>
            </ul>
        </aside>

        <section class="content">
            
            <div class="content-header">
                <div class="header-info">
                    <h1>我的交换</h1>
                    <p>查看别人向我发起的申请，待处理申请会优先显示</p>
                </div>
                <div id="tradeCountText">正在统计...</div>
            </div>

            <div class="trade-list" id="tradeList">
                <p class="loading-text">正在加载我的交换...</p>
            </div>
            
        </section>
        
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/myexchange.js"></script>
</body>
</html>
