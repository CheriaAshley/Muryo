<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的申请 - Muryo</title>
    <link rel="stylesheet" href="css/myapply.css">

    <!-- 预连接，优化 Google Fonts 加载性能 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page">

    <!-- 顶部栏 -->
    <header class="topbar">
        <div class="logo">Muryo ~</div>

        <div class="user-actions">
            <span id="welcomeText"></span>
            <button id="loginBtn">登录</button>
            <button id="logoutBtn">退出登录</button>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="main">

        <!-- 侧边栏 -->
        <aside class="sidebar">
            <nav>
                <ul>
                    <li id="homeNav" role="button" tabindex="0">首页</li>
                    <li id="myPageNav" role="button" tabindex="0">我的主页</li>
                    <li id="myApplyNav" class="active" role="button" tabindex="0">我的申请</li>
                    <li id="myExchangeNav" role="button" tabindex="0">我的交换</li>
                    <li id="todoApplyNav" role="button" tabindex="0">待办申请</li>
                    <li id="adminEntry" role="button" tabindex="0" style="display: none;">管理员中心</li>
                </ul>
            </nav>
        </aside>

        <!-- 内容区域 -->
        <section class="content">
            <div class="content-header">
                <h1>我的申请</h1>
                <p>查看我提交的申请，待处理申请会优先显示</p>
            </div>

            <div class="apply-section">
                <div class="section-title-row">
                    <h2>我提交的申请</h2>
                    <span id="applyCountText">正在统计...</span>
                </div>
                <div class="apply-list" id="applyList">
                    <p class="loading-text">正在加载我的申请...</p>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- 编辑弹窗 -->
<div id="editModal" class="modal" style="display: none;">
    <div class="modal-box">
        <button class="close-btn" id="closeEditModal" aria-label="关闭">&times;</button>
        <h2>修改交换时间和地点</h2>

        <input type="hidden" id="editExchangeId">

        <div class="form-group">
            <label for="editDate">交换日期 (纯数字，如: 20260524)</label>
            <input type="number" id="editDate" placeholder="请输入数字格式的日期">
        </div>

        <div class="form-group">
            <label for="editLocation">交换地点</label>
            <input type="text" id="editLocation" placeholder="请输入具体的交换地点">
        </div>

        <button class="submit-btn" id="submitEdit" style="width: 100%; margin-top: 20px;">确认修改</button>
    </div>
</div>

<script src="js/auth.js" defer></script>
<script src="js/myapply.js" defer></script>
