<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>待办申请 - Muryo</title>

    <link rel="stylesheet" href="css/todoapply.css">

    <!-- 预连接，优化 Google Fonts 加载性能 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="page">

    <header class="topbar">
        <div class="logo">Muryo ~</div>

        <div class="user-actions">
            <span id="welcomeText"></span>
            <button id="loginBtn" type="button">登录</button>
            <button id="logoutBtn" type="button">退出登录</button>
        </div>
    </header>

    <main class="main">

        <aside class="sidebar">
            <nav>
                <ul>
                    <li id="homeNav" role="button" tabindex="0">首页</li>
                    <li id="myPageNav" role="button" tabindex="0">我的主页</li>
                    <li id="myApplyNav" role="button" tabindex="0">我的申请</li>
                    <li id="myExchangeNav" role="button" tabindex="0">我的交换</li>
                    <li id="todoApplyNav" class="active" role="button" tabindex="0">待办申请</li>
                    <li id="adminEntry" role="button" tabindex="0" style="display: none;">管理员中心</li>
                </ul>
            </nav>
        </aside>

        <section class="content">
            <div class="content-header">
                <h1>待办申请</h1>
                <p>查看我收到的未处理申请和待交换申请</p>
            </div>

            <div class="apply-section">
                <div class="section-title-row">
                    <h2>我收到的待办申请</h2>
                    <span id="todoCountText">正在统计...</span>
                </div>

                <div class="apply-list" id="todoList">
                    <p class="loading-text">正在加载待办申请...</p>
                </div>
            </div>
        </section>

    </main>
</div>

<script src="js/auth.js" defer></script>
<script src="js/todoapply.js" defer></script>
</body>
</html>
