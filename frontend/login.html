<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>欢迎来到Muryo~ </title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container">
    <div class="formbox">
        <h2 class="title">欢迎来到Muryo~</h2>
        <form onsubmit="login(); return false;">
            <input type="text" id="username" name="username" placeholder="请输入咪的用户名">
            <input type="password" id="password" name="password" placeholder="请咪输入密码，注意区分大小写哟~">

            <button type="submit" id="loginBtn">登录</button>
        </form>
        <p id="msg" class="msg-text"></p>
        
        <p class="register-text">
            还没有使用过Muryo？
            <a href="register.html">点击这里注册~</a>
        </p>
    </div>
</div>

<script src="js/login.js"></script>
<script>
    document.getElementById("username").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            document.getElementById("password").focus();
        }
    });

    document.getElementById("password").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            login();
        }
    });
</script>
</body>
</html>
