<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>注册 Muryo 账号</title>

    <link rel="stylesheet" href="css/login.css">

    <!-- 预连接，优化 Google Fonts 加载性能 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">
</head>

<body>
<div class="container">
    <div class="formbox">
        <h2 class="title">加入 Muryo ~</h2>

        <form id="registerForm">
            <input
                type="text"
                id="username"
                name="username"
                placeholder="咪请输入想注册的用户名~"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="请输入密码"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="咪再次确认一下密码~"
                required
            >

            <button type="submit" id="registerBtn">注册</button>
        </form>

        <p id="msg" class="msg-text"></p>

        <p class="register-text">
            已经有账号了？
            <a href="login.html">回到登录</a>
        </p>
    </div>
</div>

<script src="js/register.js" defer></script>
</body>
</html>
